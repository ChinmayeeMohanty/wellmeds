<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .appointment-container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .appointment-container h2 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #1976d2;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #125ca1;
        }
    </style>
</head>

<body>

    <div class="appointment-container">

        <h2>Book an Appointment</h2>

        <form th:action="@{/appointment}"
              th:object="${appointment}"
              method="post">

            <div class="form-group">
                <label>Patient Name</label>
                <input type="text"
                       th:field="*{patientName}"
                       placeholder="Enter patient name"
                       required>
            </div>

            <div class="form-group">
                <label>Patient Email</label>
                <input type="email"
                       th:field="*{patientEmail}"
                       placeholder="Enter email address"
                       required>
            </div>

            <div class="form-group">
                <label>Patient Age</label>
                <input type="number"
                       th:field="*{age}"
                       placeholder="Enter age"
                       min="1"
                       max="120"
                       required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select th:field="*{gender}" required>
                    <option value="">Select Gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Doctor</label>

                <select th:field="*{doctorName}" required>
                    <option value="">Select Doctor</option>
                    <option value="Dr.Baidyanth">Dr. Baidyanth</option>
                    <option value="Dr.Jyotirmayee">Dr. Jyotirmayee</option>
                    <option value="Dr.Chinmay">Dr. Chinmay</option>
                </select>
            </div>

            <div class="form-group">
                <label>Appointment Date</label>

                <input type="date"
                       th:field="*{appointmentDate}"
                       required>
            </div>

            <div class="form-group">
                <label>Patient Symptoms</label>

                <input type="text"
                       th:field="*{symptoms}"
                       placeholder="Describe your symptoms"
                       required>
            </div>

            <button type="submit" class="submit-btn">
                Book Appointment
            </button>

        </form>

    </div>

</body>

</html>
