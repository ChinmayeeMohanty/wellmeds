<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | WELL MED</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            line-height: 1.7;
            color: #8c92a0;
            font-weight: 300;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #fff;
            border: 1px solid #edf0f5;
            padding: 45px 40px;
            box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo a {
            text-transform: uppercase;
            letter-spacing: .2em;
            font-size: 24px;
            color: #000;
            font-weight: 900;
            text-decoration: none;
        }

        .login-subtitle {
            text-align: center;
            color: #8c92a0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-title {
            color: #000;
            font-size: 30px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
        }

        /* Success message */
        .success-message {
            background: #f4ffff;
            border-left: 4px solid #51eaea;
            color: #000;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Error message */
        .error-message {
            background: #fff5f5;
            border-left: 4px solid #dc3545;
            color: #842029;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #000;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 7px;
        }

        .form-control {
            display: block;
            width: 100%;
            height: 43px;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            background: #fff;
            color: #000;
            font-size: 15px;
            outline: none;
            transition: .3s all ease-in-out;
        }

        .form-control:hover,
        .form-control:focus,
        .form-control:active {
            border-color: #51eaea;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #b3b3b3;
        }

        .login-btn {
            width: 100%;
            padding: 13px 20px;
            margin-top: 5px;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s all ease-in-out;
        }

        .login-btn:hover {
            background: #51eaea;
            border-color: #51eaea;
            color: #000;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf0f5;
            font-size: 13px;
        }

        .login-footer span {
            color: #8c92a0;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 35px 25px;
            }

            .login-title {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">

            <a href="#">
                WELL MED
            </a>

        </div>

        <div class="login-subtitle">
            Healthcare & Medical Services
        </div>


        <h1 class="login-title">
            Login
        </h1>


        <!-- Logout Message -->
        <div class="success-message"
             th:if="${param.logout}">
            You have successfully logged out.
        </div>


        <!-- Login Error -->
        <div class="error-message"
             th:if="${param.error}">
            Invalid username or password.
        </div>


        <!-- Login Form -->
        <form th:action="@{/login}"
              method="post">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>


            <button type="submit"
                    class="login-btn">
                Login
            </button>

        </form>


        <div class="login-footer">

            <span>
                Secure login for WELL MED users
            </span>

        </div>

    </div>

</div>

</body>

</html>
